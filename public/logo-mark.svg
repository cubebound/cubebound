<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="cbmTitle">
  <title id="cbmTitle">Cubebound</title>
  <!--
    The small mark. public/logo.svg is drawn on a 320x300 viewBox with 1.2-2px
    strokes; rendered 26-30px tall in the nav those land at roughly 0.15 CSS
    pixels, which is under what a display can paint - so the cube's edges grey
    out and shimmer instead of reading as lines. That is the bug this file
    fixes, and it fixes it the same way src/app/icon.svg already did for the
    favicon: redraw at 64x64 with strokes heavy enough to survive the scale.

    It is icon.svg without the rounded background plate, which the favicon needs
    to sit on a browser tab and the nav does not. Kept in step with both by
    colour (#ff6a2b) and shape, not by sharing a file.
  -->
  <g fill="none" stroke="#ff6a2b" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32 6 L56 20 L56 44 L32 58 L8 44 L8 20 Z" stroke-width="5"/>
    <path d="M32 32 L8 20 M32 32 L56 20 M32 32 L32 58" stroke-width="3.75" opacity="0.72"/>
  </g>
</svg>
