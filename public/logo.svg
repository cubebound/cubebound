<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="cbTitle cbDesc">
  <title id="cbTitle">Cubebound logo</title>
  <desc id="cbDesc">A transparent cube containing floating cards with orange-lit edges and sparkles.</desc>

  <!--
    The detailed mark, used at `lg` (64px) on the landing page, the 404 and the
    error page. The nav uses public/logo-mark.svg instead - see
    src/components/logo.tsx for why.

    Stroke widths here are sized for that 64px render, not for the viewBox.
    The scale factor is 64/300, so a 1.5-unit stroke lands at 0.32 CSS pixels -
    under what a display can paint, which is why the cube's edges used to grey
    out and shimmer. Every line below is drawn at 3.5x the weight the artwork
    was designed at, so the thinnest one still resolves to about 1 device pixel
    at 64px. If this mark is ever rendered much larger, the weights want
    revisiting.
  -->

  <!-- Hidden rear edges (dashed), drawn first so everything sits on top of them.
       Each segment starts at the centre vertex so the dash pattern meets cleanly
       there, and stops just short of the outer corners so it tucks under the
       solid frame. -->
  <g stroke="#4a4a53" stroke-width="4.2" fill="none" stroke-dasharray="17.5 14" stroke-linecap="round">
    <path d="M160 140 L33 76.5"/>
    <path d="M160 140 L287 76.5"/>
    <path d="M160 140 L160 277"/>
  </g>

  <!-- Background cards (dim, fully opaque, drawn behind the bright ones) -->
  <g transform="translate(76,172) rotate(28)">
    <rect x="-16" y="-22" width="32" height="44" rx="4" fill="#26262c" stroke="#8f4a1f" stroke-width="3.5"/>
    <rect x="-10" y="-15" width="20" height="15" rx="2" fill="#8f4a1f"/>
  </g>
  <g transform="translate(228,98) rotate(-22)">
    <rect x="-14" y="-19" width="28" height="38" rx="3" fill="#26262c" stroke="#8f4a1f" stroke-width="3.5"/>
    <rect x="-9" y="-13" width="18" height="13" rx="2" fill="#a0562a"/>
  </g>

  <!-- Foreground cards (bright, fully opaque) -->
  <g transform="translate(107,100) rotate(-14)">
    <rect x="-26" y="-36" width="52" height="72" rx="5" fill="#2e2e35" stroke="#ff6a2b" stroke-width="5.25"/>
    <rect x="-18" y="-28" width="36" height="30" rx="3" fill="#ff7d45"/>
    <rect x="-18" y="8" width="36" height="5" rx="2.5" fill="#8a8a94"/>
    <rect x="-18" y="17" width="26" height="5" rx="2.5" fill="#6a6a74"/>
  </g>
  <g transform="translate(202,142) rotate(18)">
    <rect x="-24" y="-33" width="48" height="66" rx="5" fill="#2e2e35" stroke="#ffb36b" stroke-width="5.25"/>
    <rect x="-16" y="-25" width="32" height="26" rx="3" fill="#ffbd7f"/>
    <rect x="-16" y="7" width="32" height="5" rx="2.5" fill="#8a8a94"/>
    <rect x="-16" y="16" width="22" height="5" rx="2.5" fill="#6a6a74"/>
  </g>
  <g transform="translate(148,198) rotate(-30)">
    <rect x="-20" y="-27" width="40" height="54" rx="4" fill="#2e2e35" stroke="#ff6a2b" stroke-width="4.2"/>
    <rect x="-13" y="-20" width="26" height="20" rx="3" fill="#ff9a5c"/>
    <rect x="-13" y="6" width="26" height="4.5" rx="2.25" fill="#8a8a94"/>
  </g>

  <!-- Sparkles. Sized up like the strokes: at the artwork's own scale the small
       ones are a pixel and a half across at 64px and read as dirt rather than
       as light. -->
  <g fill="#ffb36b">
    <path d="M160 50 l4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 Z"/>
    <path d="M72 128 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 Z" opacity="0.85"/>
    <path d="M238 182 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 Z" opacity="0.85"/>
    <circle cx="120" cy="68" r="3.5" opacity="0.9"/>
    <circle cx="198" cy="208" r="3.5" opacity="0.9"/>
    <circle cx="53" cy="100" r="2.75" opacity="0.7"/>
    <circle cx="267" cy="135" r="2.75" opacity="0.7"/>
    <circle cx="172" cy="118" r="2.75" opacity="0.6"/>
  </g>

  <!-- Outer silhouette: one closed path, one colour, rounded joins so corners
       are clean. Drawn last so the cube reads as the outermost shape rather
       than being cut into by the cards. -->
  <path d="M160 10 L290 75 L290 215 L160 280 L30 215 L30 75 Z"
        fill="none" stroke="#ff6a2b" stroke-width="7" stroke-linejoin="round"/>
</svg>
