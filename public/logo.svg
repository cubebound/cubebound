<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="cbTitle cbDesc">
  <title id="cbTitle">Cubebound logo</title>
  <desc id="cbDesc">A transparent cube containing floating cards with orange-lit edges and sparkles.</desc>

  <!--
    The detailed mark, used at `lg` (64px) on the landing page, the 404 and the
    error page. The nav uses public/logo-mark.svg instead - see
    src/components/logo.tsx for why.

    Stroke widths here are sized for that 64px render, not for the viewBox.
    The scale factor is 64/300, so a 1.5-unit stroke lands at 0.32 CSS pixels -
    under what a display can paint, which is why the cube's edges used to grey
    out and shimmer. Everything below is drawn at roughly 3.5x what it was, so
    the thinnest line still resolves to about 1 device pixel at 64px. If this
    mark is ever rendered much larger, the weights want revisiting.
  -->

  <!-- Hidden rear edges (dashed) - the transparency cue -->
  <g stroke="#5a5a66" stroke-width="4.5" fill="none" stroke-dasharray="16 13" stroke-linecap="round">
    <path d="M30 75 L160 140 L290 75 M160 140 L160 280"/>
  </g>

  <!-- Floating cards (foreground bright, background dim) -->
  <g transform="translate(107,100) rotate(-14)">
    <rect x="-26" y="-36" width="52" height="72" rx="5" fill="#2e2e35" stroke="#ff6a2b" stroke-width="4.5"/>
    <rect x="-18" y="-28" width="36" height="30" rx="3" fill="#ff6a2b" opacity="0.85"/>
    <rect x="-18" y="8" width="36" height="5" rx="2.5" fill="#8a8a94"/>
    <rect x="-18" y="17" width="26" height="5" rx="2.5" fill="#6a6a74"/>
  </g>
  <g transform="translate(202,142) rotate(18)">
    <rect x="-24" y="-33" width="48" height="66" rx="5" fill="#2e2e35" stroke="#ffb36b" stroke-width="4.5"/>
    <rect x="-16" y="-25" width="32" height="26" rx="3" fill="#ffb36b" opacity="0.85"/>
    <rect x="-16" y="7" width="32" height="5" rx="2.5" fill="#8a8a94"/>
    <rect x="-16" y="16" width="22" height="5" rx="2.5" fill="#6a6a74"/>
  </g>
  <g transform="translate(148,198) rotate(-30)">
    <rect x="-20" y="-27" width="40" height="54" rx="4" fill="#2e2e35" stroke="#ff6a2b" stroke-width="4"/>
    <rect x="-13" y="-20" width="26" height="20" rx="3" fill="#ff8b45" opacity="0.85"/>
    <rect x="-13" y="6" width="26" height="4.5" rx="2.25" fill="#8a8a94"/>
  </g>
  <g transform="translate(76,172) rotate(28)" opacity="0.8">
    <rect x="-16" y="-22" width="32" height="44" rx="4" fill="#2c2c33" stroke="#c96a2e" stroke-width="3.5"/>
    <rect x="-10" y="-15" width="20" height="15" rx="2" fill="#b0561f" opacity="0.85"/>
  </g>
  <g transform="translate(228,98) rotate(-22)" opacity="0.75">
    <rect x="-14" y="-19" width="28" height="38" rx="3" fill="#2c2c33" stroke="#c96a2e" stroke-width="3.5"/>
    <rect x="-9" y="-13" width="18" height="13" rx="2" fill="#c96a2e" opacity="0.85"/>
  </g>

  <!-- Sparkles. Scaled up with everything else: at the old size the small ones
       were a pixel and a half across and read as dirt rather than as light. -->
  <g fill="#ffb36b">
    <path d="M160 44 l4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 Z"/>
    <path d="M70 126 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 Z" opacity="0.9"/>
    <path d="M240 182 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 Z" opacity="0.9"/>
    <circle cx="120" cy="66" r="3.5" opacity="0.9"/>
    <circle cx="198" cy="210" r="3.5" opacity="0.9"/>
    <circle cx="51" cy="100" r="2.75" opacity="0.75"/>
    <circle cx="269" cy="135" r="2.75" opacity="0.75"/>
  </g>

  <!-- Lit edges: bottom strong, top soft. Drawn last so the cube reads as the
       outermost shape rather than being cut into by the cards. -->
  <g stroke="#ff6a2b" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M290 75 L290 215 L160 280 L30 215 L30 75" stroke-width="7"/>
    <path d="M30 75 L160 10 L290 75" stroke-width="5.5" opacity="0.6"/>
  </g>
</svg>
