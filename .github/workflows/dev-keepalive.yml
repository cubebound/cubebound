# Keeps the cubebound-dev Supabase project from pausing.
#
# Free Supabase projects pause after a week with no activity, and dev goes a
# week untouched whenever nobody is building. This runs one PostgREST query
# every three days, so a missed or delayed run still lands inside the week.
#
# It uses the dev **publishable** key, which is browser-safe by design. RLS is on
# for every table with no policies, so the query returns `[]` and the key can
# read and write nothing; the request still reaches Postgres, which is what
# counts as activity. Never put a secret key, a DATABASE_URL, or anything from
# the production project in these secrets.
#
# Scheduled workflows run only from the default branch. Run it by hand from the
# Actions tab (workflow_dispatch) to confirm the secrets are set.
name: Dev Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the dev project
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::DEV_SUPABASE_URL and DEV_SUPABASE_PUBLISHABLE_KEY must be set as repository secrets"
            exit 1
          fi
          case "$SUPABASE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::DEV_SUPABASE_PUBLISHABLE_KEY must be an sb_publishable_ key, never a secret one"; exit 1 ;;
          esac
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/cards?select=id&limit=1")
          echo "dev Supabase answered $status"
          [ "$status" = "200" ]
